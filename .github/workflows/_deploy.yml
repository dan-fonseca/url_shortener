name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

env:
  TF_VERSION: '~1.13'

jobs:
  deploy:
    name: Apply · ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Protection rules (e.g. required reviewers on prod) are configured on the GitHub environment.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.outputs.outputs.public_url }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: services/api/dist
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        run: >
          terraform plan -input=false -out=tfplan
          -var="region=${{ vars.AWS_REGION }}" -var="repository=${{ github.repository }}"

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read outputs
        id: outputs
        run: |
          {
            echo "public_url=$(terraform output -raw public_url)"
            echo "web_bucket=$(terraform output -raw web_bucket)"
            echo "distribution_id=$(terraform output -raw distribution_id)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload frontend
        working-directory: web/dist
        env:
          BUCKET: ${{ steps.outputs.outputs.web_bucket }}
        run: |
          # Hashed assets are immutable; index.html must always revalidate.
          aws s3 sync . "s3://$BUCKET/app/" --delete --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp index.html "s3://$BUCKET/app/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ steps.outputs.outputs.distribution_id }}"
          --paths "/app" "/app/" "/app/index.html"

      - name: Smoke test
        working-directory: .
        run: bash scripts/smoke-test.sh "${{ steps.outputs.outputs.public_url }}"
